<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>The Odia Loom: Launch Tracker</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fbf7f0;--fg:#2a1f1a;--mut:#7a6a60;--card:#fff;--line:#e6dccd;--acc:#9b2d30;--c0:#0f766e;--c1:#b45309;--c2:#4338ca;--c3:#7c3aed;--c4:#be123c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1613;--fg:#f3e9dd;--mut:#b5a598;--card:#2a211c;--line:#44372f;--acc:#e0686b;--c0:#2dd4bf;--c1:#fbbf24;--c2:#a5b4fc;--c3:#c4b5fd;--c4:#fb7185}}
:root[data-theme="dark"]{--bg:#1c1613;--fg:#f3e9dd;--mut:#b5a598;--card:#2a211c;--line:#44372f;--acc:#e0686b;--c0:#2dd4bf;--c1:#fbbf24;--c2:#a5b4fc;--c3:#c4b5fd;--c4:#fb7185}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1040px;margin:0 auto;padding:20px 14px 60px}
h1{font:600 26px Georgia,serif;margin:0 0 4px}h2{font:600 18px Georgia,serif;margin:28px 0 10px}
.sub{color:var(--mut);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.big{font:600 34px Georgia,serif;color:var(--acc)}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;flex:1;min-width:140px}.bar i{display:block;height:100%;background:var(--acc)}
input[type=date]{font:inherit;padding:4px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:12px}
.mini{font-size:13px}.mini b{display:block;font-size:14px}
.gwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.g{position:relative;min-width:1200px}
.gr{display:flex;height:26px;align-items:center;border-bottom:1px solid var(--line)}
.gl{flex:0 0 240px;position:sticky;left:0;background:var(--card);z-index:3;padding:0 10px;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-right:1px solid var(--line);height:100%;display:flex;align-items:center}
.gt{position:relative;flex:1;height:100%}
.gh .gl,.gh{font-weight:600;font-size:12px;color:var(--mut)}
.gp{background:var(--bg)}.gp .gl{background:var(--bg);font-weight:600}
.wk{position:absolute;top:0;bottom:0;border-left:1px solid var(--line);font-size:11px;padding-left:3px;color:var(--mut);display:flex;align-items:center}
.pz{position:absolute;top:0;bottom:0;background:#f59e0b;opacity:.18;z-index:1}
.td{position:absolute;top:0;bottom:0;width:2px;background:var(--acc);z-index:2}
.bk{position:absolute;top:6px;height:14px;border-radius:4px;opacity:.4;z-index:2;min-width:6px}.bk.d{opacity:1}
.ph{margin-top:18px}.ph h3{margin:0;font:600 16px system-ui}.ph p{margin:2px 0 8px;color:var(--mut);font-size:13px}
.it{display:flex;gap:10px;align-items:flex-start;padding:8px 2px;border-top:1px solid var(--line)}
.it input{margin-top:4px;width:18px;height:18px;flex:none;accent-color:var(--acc)}
.it.d .tx{text-decoration:line-through;color:var(--mut)}
.mt{font-size:12px;color:var(--mut)}
.tag{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:10px;padding:0 7px;margin-right:4px}
button{font:inherit;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--acc);color:#fff;cursor:pointer}
.pbs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.pb{background:var(--card);color:var(--fg);border:2px solid var(--c,var(--line));border-radius:10px;padding:7px 12px;font-size:14px}
.pb.on{background:color-mix(in srgb,var(--c) 18%,var(--card));font-weight:600}
.pb.ghost{border-color:var(--line);color:var(--mut);font-size:13px}
.pb small{color:var(--mut);margin-left:4px}
#msg{color:var(--acc);font-size:13px;min-height:18px;margin-top:6px}
.lg span{margin-right:12px;font-size:12px;color:var(--mut)}
</style></head><body><main><div id="app"></div></main>
<script>
const P=[["Weaver sourcing, catalog & QC","3-4 verified weaver partners and 30-40 sarees photographed, with no stock bought"],["Fulfillment, logistics & payments","A tested order-to-delivery path for India, UAE and one more market"],["Low-cost tech stack","Live Shopify store and WhatsApp flow, proven with test orders"],["Remote founder operations","A weekly rhythm across Bangalore, Bhubaneswar and Dubai"],["Branding & launch","50 paid orders, organically"]];
// [phase, task, owner, startDay, days]
const T=[
[0,"Shortlist 1-2 weaver societies per cluster (Sambalpur, Nuapatna, Berhampur, Sonepur, Jajpur, Kalahandi, Koraput)","F1",0,7],
[0,"Verify GI-tag authenticity and society registration","F1",5,7],
[0,"Agree terms: pay-first orders, lead times, pricing, advance, defect handling","F1",10,7],
[0,"Write QC checklist and photo/video sign-off step","F1",10,7],
[0,"Get samples or weaver photos/videos for the launch range","F1",14,10],
[0,"Shoot catalog and write product copy and weaver stories","F3",21,7],
[0,"Fix price lists, including landed cost per market","All",24,4],
[0,"Set weaver yarn and timeline confirmation process","F1",24,4],
[1,"Compare couriers per market (India, UAE, USA, UK, Singapore, Australia)","F1",14,10],
[1,"Export basics: IEC, GST on exports, HS code, customs documents","F2",14,14],
[1,"Choose payment gateways (Razorpay Intl, Stripe, PayPal) and complete KYC","F2",21,14],
[1,"Eco-friendly packaging and dispatch checklist","F1",24,10],
[1,"Shipping, returns and made-to-order policies","F3",28,7],
[1,"Run a test order through the whole chain","All",35,7],
[2,"Set up Shopify store: theme, collections, made-to-order messaging","F3",21,14],
[2,"Connect gateways and multi-currency pricing","F3",35,7],
[2,"Shipping zones and tax settings","F3",35,7],
[2,"Set up WhatsApp Business: catalog, quick replies, labels, channel","F3",24,14],
[2,"Order-status message templates (paid, with weaver, QC passed, dispatched)","F3",38,4],
[2,"Shared order tracker for all three founders","F3",28,7],
[2,"Test purchases end to end","All",42,7],
[3,"Write role boundaries for F1, F2 and F3","All",28,4],
[3,"Shared calendar and weekly sync that works for IST and GST","All",28,4],
[3,"Agree customer and weaver response-time standards","All",32,4],
[3,"Order handoff protocol: payment, weaver order, QC, dispatch","All",32,7],
[3,"Shared SOP docs, supplier contacts, price list, expense log","All",35,14],
[4,"Finalize brand name, logo, story and tone","All",35,10],
[4,"Create launch content: weaver stories, process videos, drape reels, care guide","F3",42,14],
[4,"Start Instagram and WhatsApp Channel posting, pre-launch waitlist","F3",42,14],
[4,"Soft launch to personal networks (target first 10 orders)","All",49,14],
[4,"UAE and NRI outreach, including community groups and luxury clients","F2",49,28],
[4,"Collect testimonials and customer photos","All",56,14],
[4,"Referral and repeat-buyer nudges on WhatsApp","F3",63,14],
[4,"Weekly review: orders, source, delivery time, defects","All",56,28],
[4,"Milestone: 10 paid orders","All",63,1],
[4,"Milestone: 25 paid orders","All",74,1],
[4,"Milestone: 50 paid orders","All",84,1]];
const OPEN={};
const O={F1:"F1 Bhubaneswar",F2:"F2 Dubai",F3:"F3 Bangalore",All:"All founders"};
const st={start:"2026-10-10",done:{}};
const DAY=864e5,SPAN=91,W=1200-240;
const GH={o:"priyadeo",r:"The_Odia_Loom",b:"main",p:"status.json"};
const t0=()=>Date.parse(st.start+'T00:00:00Z');
const ad=n=>new Date(t0()+n*DAY);
const f=d=>d.toLocaleDateString('en-IN',{day:'numeric',month:'short',timeZone:'UTC'});
const off=ms=>Math.round((ms-t0())/DAY);
const pc=(n,d)=>d?Math.round(100*n/d):0;
function tp(i){OPEN[i]=!OPEN[i];render()}
function tpAll(v){P.forEach((p,i)=>{OPEN[i]=!!v});render()}
function render(){const y=window.scrollY;
const tot=T.length,dn=Object.keys(st.done).length;
const ph=P.map((p,i)=>{const a=T.map((t,j)=>[t,j]).filter(x=>x[0][0]==i);return{a,d:a.filter(x=>st.done[x[1]]).length}});
const now=new Date(),todayOff=off(Date.UTC(now.getFullYear(),now.getMonth(),now.getDate()));
const pz0=off(Date.UTC(2026,9,16)),pz1=off(Date.UTC(2026,9,21))+1;
const nxt=T.map((t,j)=>[t,j]).filter(x=>!st.done[x[1]]).sort((a,b)=>a[0][3]-b[0][3]).slice(0,3);
let h=`<h1>The Odia Loom: Launch Tracker</h1><p class="sub">Odisha GI handloom sarees: zero inventory, 3 founders, first 50 paid orders. Tick items as they are done; progress is saved to GitHub for all founders.</p>
<div class="card"><div class="row"><div class="big">${pc(dn,tot)}%</div><div class="bar"><i style="width:${pc(dn,tot)}%"></i></div><div class="mt">${dn} of ${tot} done</div></div>
<div class="row" style="margin-top:10px"><label class="mt">Start date (default: Mahalaya, Sat 10 Oct 2026) <input type="date" id="sd" value="${st.start}" onchange="setStart(this.value)"></label></div>
<div class="mt" style="margin-top:6px">Durga Puja days, 16-21 Oct, are shaded on the chart. Plan ends around ${f(ad(84))}. Dates vary slightly by source, so confirm the puja dates for your area.</div>
<div class="grid">${P.map((p,i)=>`<div class="mini"><b style="color:var(--c${i})">Phase ${i+1}: ${pc(ph[i].d,ph[i].a.length)}%</b>${p[0]}</div>`).join('')}</div>
${nxt.length?`<div class="mt" style="margin-top:12px"><b>Up next:</b> ${nxt.map(x=>x[0][1]).join(' | ')}</div>`:'<div class="mt" style="margin-top:12px">All done. Congratulations!</div>'}</div>`;
h+=`<h2>Gantt chart</h2><div class="lg mt">${P.map((p,i)=>`<span><b style="color:var(--c${i})">■</b> ${p[0]}</span>`).join('')}<span>Faded = pending, solid = done</span></div><div class="gwrap" style="margin-top:8px"><div class="g">`;
let wk='';for(let w=0;w*7<SPAN;w++)wk+=`<div class="wk" style="left:${w*7/SPAN*100}%">W${w+1} ${f(ad(w*7))}</div>`;
const ov=(pz0<SPAN&&pz1>0?`<div class="pz" style="left:${Math.max(0,pz0)/SPAN*100}%;width:${(Math.min(SPAN,pz1)-Math.max(0,pz0))/SPAN*100}%"></div>`:'')+(todayOff>=0&&todayOff<SPAN?`<div class="td" style="left:${todayOff/SPAN*100}%"></div>`:'');
h+=`<div class="gr gh"><div class="gl">Task</div><div class="gt">${wk}</div></div>`;
P.forEach((p,i)=>{h+=`<div class="gr gp"><div class="gl" style="color:var(--c${i})">Phase ${i+1}: ${p[0]}</div><div class="gt">${wk.replace(/>W\d+ [^<]*</g,'><')}${ov}</div></div>`;
ph[i].a.forEach(([t,j])=>{h+=`<div class="gr"><div class="gl" title="${t[1]}">${t[1]}</div><div class="gt">${wk.replace(/>W\d+ [^<]*</g,'><')}${ov}<div class="bk${st.done[j]?' d':''}" style="background:var(--c${i});left:${t[3]/SPAN*100}%;width:${t[4]/SPAN*100}%" title="${f(ad(t[3]))} to ${f(ad(t[3]+t[4]-1))}"></div></div></div>`})});
h+=`</div></div><h2>Checklist</h2><div class="pbs">${P.map((p,i)=>`<button class="pb${OPEN[i]?' on':''}" style="--c:var(--c${i})" onclick="tp(${i})">${OPEN[i]?'▾':'▸'} Phase ${i+1}: ${p[0]} <small>${ph[i].d}/${ph[i].a.length}</small></button>`).join('')}<button class="pb ghost" onclick="tpAll(1)">Show all</button><button class="pb ghost" onclick="tpAll(0)">Hide all</button></div>${P.some((p,i)=>OPEN[i])?'':'<p class="mt">Tap a phase to see its tasks. You can open more than one.</p>'}`;
P.forEach((p,i)=>{if(!OPEN[i])return;h+=`<div class="ph card"><h3 style="color:var(--c${i})">Phase ${i+1}: ${p[0]} <span class="mt">(${ph[i].d}/${ph[i].a.length})</span></h3><p>Goal: ${p[1]}</p>`;
ph[i].a.forEach(([t,j])=>{const d=st.done[j];h+=`<label class="it${d?' d':''}"><input type="checkbox" ${d?'checked':''} onchange="tg(${j})"><span><span class="tx">${t[1]}</span><br><span class="mt"><span class="tag">${O[t[2]]}</span>${f(ad(t[3]))} to ${f(ad(t[3]+t[4]-1))}${d?' | done '+d:''}</span></span></label>`});h+=`</div>`});
h+=conn();
document.getElementById('app').innerHTML=h;window.scrollTo(0,y)}
const API=`https://api.github.com/repos/${GH.o}/${GH.r}/contents/${GH.p}`;
const tok=()=>{try{return localStorage.getItem('gh_tok')||''}catch(e){return ''}};
const hd=raw=>{const h={Accept:raw?'application/vnd.github.raw+json':'application/vnd.github+json'};if(tok())h.Authorization='Bearer '+tok();return h};
const msg=t=>{const m=document.getElementById('msg');if(m)m.textContent=t};
function conn(){const t=tok();return `<div class="card" style="margin-top:18px"><b>Save to GitHub</b><div class="mt">${t?'Connected: ticks are saved to the repo for everyone.':'Not connected: ticks save on this device only. Paste a GitHub token with write access to the repo to share progress with all founders (token kept only in this browser).'}</div><div class="row" style="margin-top:8px">${t?'<button onclick="setTok(\'\')">Disconnect</button>':'<input type="password" id="tk" placeholder="github_pat_..." style="flex:1;min-width:200px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)"><button onclick="setTok(document.getElementById(\'tk\').value.trim())">Connect</button>'}</div><div id="msg"></div></div>`}
function setTok(v){try{v?localStorage.setItem('gh_tok',v):localStorage.removeItem('gh_tok')}catch(e){}render()}
async function load(){try{let r=await fetch(API+'?ref='+GH.b,{headers:hd(true),cache:'no-store'});if(!r.ok)r=await fetch(GH.p+'?t='+Date.now());const d=await r.json();st.start=d.start||st.start;st.done=d.done||{}}catch(e){}
if(!tok()){try{const l=JSON.parse(localStorage.getItem('tracker_local')||'null');if(l){st.start=l.start||st.start;st.done=l.done||{}}}catch(e){}}
render()}
function keepLocal(){try{localStorage.setItem('tracker_local',JSON.stringify(st))}catch(e){}}
async function commit(op){
if(!tok()){keepLocal();msg('Saved on this device only. Connect a GitHub token below to share progress with the other founders.');return}
try{
const g=await fetch(API+'?ref='+GH.b,{headers:hd(false),cache:'no-store'});let cur={start:st.start,done:{}},sha;
if(g.ok){const j=await g.json();sha=j.sha;cur=JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\n/g,'')))))}
op(cur);
const body={message:'Update tracker status',content:btoa(unescape(encodeURIComponent(JSON.stringify(cur,null,1)))),branch:GH.b};if(sha)body.sha=sha;
const p=await fetch(API,{method:'PUT',headers:{...hd(false),'Content-Type':'application/json'},body:JSON.stringify(body)});
if(!p.ok)throw new Error(p.status);
st.start=cur.start;st.done=cur.done;render();msg('Saved to GitHub.')
}catch(e){keepLocal();msg('Shown here, but not saved to GitHub ('+e.message+'). Check the token has Contents read/write access to the repo.')}}
function apply(op){op(st);render()}
function tg(j){const on=!st.done[j],d=new Date().toLocaleDateString('en-IN',{day:'numeric',month:'short'});const op=c=>{if(on)c.done[j]=c.done[j]||d;else delete c.done[j]};apply(op);commit(op)}
function setStart(v){if(!v)return;const op=c=>{c.start=v};apply(op);commit(op)}
render();load();
</script></body></html>
